<!doctype html>
<html lang="es">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
	<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
	<meta name="theme-color" content="#0f172a" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/logo192.png" />
	<link rel="stylesheet" href="%sveltekit.assets%/global.css" />
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="tap">
	<div style="display: contents">%sveltekit.body%</div>

	<script>
		// El detector pesa 2,5 MB de wasm: sin service worker, cada visita en un
		// colegio con red mala vuelve a bajarlo. Se registra con ruta relativa al
		// <base> porque en producción el sitio cuelga de un subdirectorio.
		if ("serviceWorker" in navigator) {
			window.addEventListener("load", function () {
				navigator.serviceWorker.register("./worker.js").then(
					function () {
						navigator.serviceWorker.ready.then(function () {
							function send() {
								if (!navigator.serviceWorker.controller) return;

								var urls = performance
									.getEntriesByType("resource")
									.map(function (entry) {
										return entry.name;
									})
									.filter(function (url) {
										return url.indexOf(location.origin) === 0;
									});

								urls.push(location.pathname);

								navigator.serviceWorker.controller.postMessage({
									type: "warm-cache",
									urls: urls,
								});
							}

							if (navigator.serviceWorker.controller) {
								send();
								return;
							}

							navigator.serviceWorker.addEventListener("controllerchange", send, { once: true });
						});
					},
					function (error) {
						console.log("Worker registration failed", error);
					}
				);
			});
		}
	</script>
</body>

</html>
